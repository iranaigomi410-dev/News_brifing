<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海外ニュース・デイリーブリーフィング v2.0</title>
<style>
/* ===== Design tokens ===== */
:root {
  --bg:        #0d1117;
  --sidebar:   #13161f;
  --panel:     #1c2030;
  --panel2:    #242840;
  --border:    #2d3250;
  --text:      #e2e8f6;
  --dim:       #8b97b8;
  --muted:     #505c7a;
  --accent:    #5b9bff;
  --accent2:   #3a7be0;
  /* 7 categories */
  --cbank:     #38bdf8;
  --indicator: #f6a035;
  --geo:       #e05c5c;
  --fiscal:    #34d399;
  --mktdirect: #a78bfa;
  --breaking:  #fb923c;
  /* confidence */
  --high:      #34d399;
  --medium:    #f6a035;
  /* asset tags */
  --tag-up:    #22c55e;
  --tag-down:  #ef4444;
  --radius:    10px;
  --shadow:    0 2px 16px rgba(0,0,0,.45);
}
@media (prefers-color-scheme: light) {
  :root {
    --bg:      #f0f2f8;
    --sidebar: #ffffff;
    --panel:   #ffffff;
    --panel2:  #f4f6fc;
    --border:  #dde0ec;
    --text:    #1a1e2e;
    --dim:     #4a5268;
    --muted:   #8892a8;
    --shadow:  0 2px 16px rgba(0,0,0,.08);
  }
}

/* ===== Reset ===== */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  font-size:15px;line-height:1.7}

/* ===== App shell ===== */
.app{display:grid;grid-template-columns:260px 1fr;height:100vh}

/* ===== Sidebar ===== */
.sidebar{
  background:var(--sidebar);border-right:1px solid var(--border);
  display:flex;flex-direction:column;height:100vh;overflow:hidden;
}
.sidebar-head{
  padding:16px 14px 12px;border-bottom:1px solid var(--border);flex-shrink:0;
}
.logo{font-size:13px;font-weight:800;letter-spacing:.04em;color:var(--text);margin-bottom:10px}
.logo span{display:block;font-size:10px;font-weight:400;color:var(--muted);letter-spacing:.01em;margin-top:2px}
.sidebar-controls{display:flex;gap:5px;align-items:center}
.sidebar-controls select{
  flex:1;background:var(--panel2);color:var(--text);
  border:1px solid var(--border);border-radius:7px;
  padding:6px 8px;font-size:12px;font-family:inherit;cursor:pointer;
}
.sidebar-controls select:hover{border-color:var(--accent)}
.icon-btn{
  flex-shrink:0;background:var(--accent);color:#fff;border:none;
  border-radius:7px;width:32px;height:32px;font-size:14px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.icon-btn:hover{background:var(--accent2)}
.icon-btn.sec{background:var(--panel2);color:var(--dim)}
.icon-btn.sec:hover{background:var(--border);color:var(--text)}
.icon-btn:disabled{opacity:.45;cursor:not-allowed}

/* Country nav */
#tabs{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:6px;display:flex;flex-direction:column;gap:1px;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent;
}
#tabs::-webkit-scrollbar{width:3px}
#tabs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.tier-label{
  font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--muted);
  padding:10px 8px 3px;text-transform:uppercase;user-select:none;
}
.tab{
  display:flex;align-items:center;justify-content:space-between;
  width:100%;background:transparent;border:1.5px solid transparent;
  color:var(--dim);padding:7px 9px;border-radius:7px;
  font-size:12px;font-family:inherit;cursor:pointer;
  transition:all .15s;text-align:left;
}
.tab:hover{background:var(--panel);color:var(--text)}
.tab.selected{background:rgba(91,155,255,.1);color:var(--accent);border-color:rgba(91,155,255,.25);font-weight:700}
.tab .tab-cur{font-size:10px;opacity:.55;margin-left:3px}
.tab .count{
  font-size:10px;padding:1px 6px;border-radius:999px;
  background:var(--panel2);color:var(--muted);flex-shrink:0;margin-left:6px;
}
.tab.selected .count{background:rgba(91,155,255,.15);color:var(--accent)}

/* Country multi-select action bar */
.tab-actions{
  display:flex;align-items:center;gap:4px;
  padding:6px 6px 10px;flex-shrink:0;
}
.tab-action-btn{
  font-size:10px;padding:2px 9px;border-radius:5px;
  border:1px solid var(--border);background:var(--panel2);
  color:var(--dim);cursor:pointer;font-family:inherit;transition:all .15s;
}
.tab-action-btn:hover{color:var(--text);border-color:var(--dim)}
.tab-sel-count{font-size:10px;color:var(--muted);margin-left:auto;white-space:nowrap}

/* Sidebar footer */
.sidebar-foot{
  padding:10px 14px;border-top:1px solid var(--border);
  flex-shrink:0;display:flex;flex-direction:column;gap:7px;
}
.gen-btn{
  width:100%;background:var(--accent);color:#fff;border:none;
  border-radius:8px;padding:9px 14px;font-size:13px;font-family:inherit;
  cursor:pointer;font-weight:700;transition:background .15s;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.gen-btn:hover:not(:disabled){background:var(--accent2)}
.gen-btn:disabled{opacity:.45;cursor:not-allowed}
.foot-meta{display:flex;justify-content:space-between;align-items:center}
.last-upd{font-size:10px;color:var(--muted)}
.api-status{font-size:10px;color:var(--muted);cursor:pointer;text-decoration:underline dotted}
.api-status:hover{color:var(--accent)}

/* ===== Main area ===== */
.main{
  display:flex;flex-direction:column;height:100vh;overflow:hidden;
  position:relative;
}
.cat-bar{
  display:flex;gap:5px;padding:9px 18px;
  border-bottom:1px solid var(--border);
  overflow-x:auto;flex-shrink:0;scrollbar-width:none;
}
.cat-bar::-webkit-scrollbar{display:none}
.cat-filter{
  background:var(--panel2);color:var(--dim);
  border:1.5px solid var(--border);border-radius:999px;
  padding:4px 12px;font-size:12px;font-family:inherit;
  cursor:pointer;white-space:nowrap;transition:all .15s;
}
.cat-filter:hover{border-color:var(--accent);color:var(--text)}
.cat-filter.active{background:rgba(91,155,255,.12);color:var(--accent);border-color:var(--accent)}
.cat-filter[data-cat="中銀・金融政策"].active{background:rgba(56,189,248,.12);color:var(--cbank);border-color:var(--cbank)}
.cat-filter[data-cat="経済指標"].active    {background:rgba(246,160,53,.12);color:var(--indicator);border-color:var(--indicator)}
.cat-filter[data-cat="地政学"].active      {background:rgba(224,92,92,.12);color:var(--geo);border-color:var(--geo)}
.cat-filter[data-cat="財政"].active        {background:rgba(52,211,153,.12);color:var(--fiscal);border-color:var(--fiscal)}
.cat-filter[data-cat="マーケット直撃"].active{background:rgba(167,139,250,.12);color:var(--mktdirect);border-color:var(--mktdirect)}
.cat-filter[data-cat="速報"].active        {background:rgba(251,146,60,.12);color:var(--breaking);border-color:var(--breaking)}

.period-bar{
  padding:4px 18px;font-size:11px;color:var(--muted);
  background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0;
}
.scroll-area{
  flex:1;overflow-y:auto;overflow-x:hidden;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent;
}
.scroll-area::-webkit-scrollbar{width:4px}
.scroll-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
#content{padding:18px 18px 60px;display:flex;flex-direction:column;gap:20px}

/* ===== Cards ===== */
.country-section{}
.country-section.collapsed .country-cards{display:none}
.country-header{
  display:flex;align-items:center;gap:8px;margin-bottom:8px;
  cursor:pointer;padding:2px 0;user-select:none;
}
.country-header:hover .country-title{color:var(--accent)}
.country-title{font-size:14px;font-weight:700;color:var(--text)}
.country-count{font-size:10px;padding:1px 7px;border-radius:999px;background:var(--panel2);color:var(--muted)}
.country-chevron{font-size:9px;color:var(--muted);margin-left:auto;transition:transform .2s}
.country-section.collapsed .country-chevron{transform:rotate(-90deg)}
.country-cards{display:flex;flex-direction:column;gap:7px}
.country-notes{
  background:rgba(91,155,255,.05);border:1px solid rgba(91,155,255,.15);
  border-radius:7px;padding:7px 11px;font-size:11px;color:var(--dim);margin-bottom:6px;
}

.card{
  background:var(--panel);border-radius:var(--radius);
  border:1px solid var(--border);border-left-width:3px;
  padding:12px 14px;transition:border-color .15s;
}
.card:hover{border-color:rgba(91,155,255,.3)}
/* Category left borders — new */
.card[data-cat="中銀・金融政策"]{border-left-color:var(--cbank)}
.card[data-cat="経済指標"]      {border-left-color:var(--indicator)}
.card[data-cat="地政学"]        {border-left-color:var(--geo)}
.card[data-cat="財政"]          {border-left-color:var(--fiscal)}
.card[data-cat="マーケット直撃"]{border-left-color:var(--mktdirect)}
.card[data-cat="速報"]          {border-left-color:var(--breaking)}
/* Legacy */
.card[data-cat="政治"]    {border-left-color:var(--geo)}
.card[data-cat="経済"]    {border-left-color:var(--indicator)}
.card[data-cat="マーケット"]{border-left-color:var(--mktdirect)}

.card-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.card-title{font-size:13px;font-weight:700;line-height:1.45;flex:1;color:var(--text)}
.card-title.breaking::before{content:"⚡ ";color:var(--breaking)}
.badges{display:flex;gap:3px;flex-wrap:wrap;flex-shrink:0;align-items:flex-start}
.badge{font-size:10px;padding:2px 7px;border-radius:999px;font-weight:600;white-space:nowrap}
/* Category badges — safe class names */
.badge-cbank    {background:rgba(56,189,248,.15);color:var(--cbank);border:1px solid var(--cbank)}
.badge-indicator{background:rgba(246,160,53,.15);color:var(--indicator);border:1px solid var(--indicator)}
.badge-geo      {background:rgba(224,92,92,.15);color:var(--geo);border:1px solid var(--geo)}
.badge-fiscal   {background:rgba(52,211,153,.15);color:var(--fiscal);border:1px solid var(--fiscal)}
.badge-mktdirect{background:rgba(167,139,250,.15);color:var(--mktdirect);border:1px solid var(--mktdirect)}
.badge-breaking {background:rgba(251,146,60,.15);color:var(--breaking);border:1px solid var(--breaking)}
.badge-unknown  {background:var(--panel2);color:var(--muted);border:1px solid var(--border)}
/* Confidence */
.badge-conf     {background:var(--panel2);color:var(--muted);border:1px solid var(--border)}
.badge-conf.high  {background:rgba(52,211,153,.12);color:var(--high);border-color:var(--high)}
.badge-conf.medium{background:rgba(246,160,53,.12);color:var(--medium);border-color:var(--medium)}

.card-summary{font-size:12px;color:var(--dim);margin-bottom:6px;line-height:1.65}
.bg-detail{margin-top:5px}
.bg-detail summary{
  font-size:10px;color:var(--muted);cursor:pointer;
  list-style:none;display:flex;align-items:center;gap:3px;user-select:none;
}
.bg-detail summary::before{content:"▶";font-size:8px;transition:transform .15s}
.bg-detail[open] summary::before{transform:rotate(90deg)}
.card-bg{
  font-size:11px;color:var(--dim);
  background:var(--panel2);border-radius:6px;
  padding:7px 11px;margin-top:5px;line-height:1.65;
}
.asset-tags{display:flex;gap:3px;flex-wrap:wrap;margin-top:7px}
.asset-tag{
  font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;white-space:nowrap;
}
.asset-tag.up  {background:rgba(34,197,94,.15);color:var(--tag-up);border:1px solid var(--tag-up)}
.asset-tag.down{background:rgba(239,68,68,.15);color:var(--tag-down);border:1px solid var(--tag-down)}
.card-sources{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.source-link{
  font-size:10px;color:var(--accent);text-decoration:none;
  background:rgba(91,155,255,.08);border:1px solid rgba(91,155,255,.2);
  border-radius:5px;padding:1px 7px;transition:all .15s;
}
.source-link:hover{background:rgba(91,155,255,.15)}

/* Empty state */
.empty-state{text-align:center;padding:48px 20px;color:var(--muted)}
.empty-state h3{font-size:16px;margin-bottom:6px;color:var(--dim)}
.empty-state p{font-size:12px;margin-bottom:14px}
.empty-gen-btn{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--accent);color:#fff;border:none;
  border-radius:8px;padding:9px 18px;font-size:13px;
  font-family:inherit;cursor:pointer;font-weight:700;
}
.empty-gen-btn:hover{background:var(--accent2)}
.footer-note{padding:10px 18px 24px;font-size:10px;color:var(--muted);text-align:center}

/* ===== Generating overlay ===== */
.gen-overlay{
  position:absolute;inset:0;
  background:rgba(13,17,23,.93);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;z-index:50;
}
.gen-overlay.hidden{display:none}
.gen-spinner{
  width:38px;height:38px;border-radius:50%;
  border:3px solid var(--border);border-top-color:var(--accent);
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.gen-label-text{font-size:13px;font-weight:600;color:var(--dim)}
.gen-stream{
  width:min(580px,88vw);max-height:180px;overflow:hidden;
  background:var(--panel);border:1px solid var(--border);
  border-radius:8px;padding:10px 12px;
  font-size:10px;font-family:monospace;color:var(--dim);
  line-height:1.5;white-space:pre-wrap;word-break:break-all;
  mask-image:linear-gradient(to top,transparent,black 35%);
}
.gen-progress-wrap{width:min(420px,84vw)}
.gen-bar-track{
  height:5px;background:var(--border);border-radius:99px;
  overflow:hidden;margin-bottom:8px;
}
.gen-bar-fill{
  height:100%;width:0%;border-radius:99px;
  background:linear-gradient(90deg,var(--accent2),var(--accent));
  transition:width .6s ease;
}
.gen-stats{
  display:flex;justify-content:space-between;align-items:center;
  font-size:11px;color:var(--dim);
}
.gen-stats-pct{font-weight:700;color:var(--accent);font-size:13px}
.gen-stop-btn{
  background:transparent;color:var(--muted);
  border:1px solid var(--border);border-radius:6px;
  padding:5px 14px;font-size:11px;font-family:inherit;
  cursor:pointer;transition:all .15s;
}
.gen-stop-btn:hover{color:var(--text);border-color:var(--dim)}

/* ===== Modals ===== */
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.7);
  display:flex;align-items:center;justify-content:center;
  z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal.open{opacity:1;pointer-events:all}
.modal-box{
  background:var(--panel);border:1px solid var(--border);
  border-radius:14px;padding:26px;width:min(460px,90vw);
  box-shadow:var(--shadow);
}
.modal-box h3{font-size:15px;font-weight:800;margin-bottom:6px}
.modal-note{font-size:11px;color:var(--muted);margin-bottom:14px;line-height:1.65}
.modal-note a{color:var(--accent)}
.modal-input{
  width:100%;background:var(--panel2);color:var(--text);
  border:1px solid var(--border);border-radius:8px;
  padding:9px 12px;font-size:13px;font-family:inherit;
  margin-bottom:14px;transition:border-color .15s;
}
.modal-input:focus{outline:none;border-color:var(--accent)}
.modal-input::placeholder{color:var(--muted)}
.modal-actions{display:flex;gap:7px;justify-content:flex-end}
.btn-pri{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:7px 16px;font-size:12px;font-family:inherit;cursor:pointer;font-weight:700}
.btn-pri:hover{background:var(--accent2)}
.btn-sec{background:var(--panel2);color:var(--dim);border:1px solid var(--border);border-radius:8px;padding:7px 16px;font-size:12px;font-family:inherit;cursor:pointer}
.btn-sec:hover{color:var(--text);border-color:var(--dim)}
.modal-err{font-size:11px;color:#e05c5c;margin-bottom:10px;display:none}
.modal-err.show{display:block}

/* ===== Settings panel ===== */
.settings-panel{
  position:fixed;inset:0;background:rgba(0,0,0,.65);
  z-index:90;opacity:0;pointer-events:none;transition:opacity .2s;
}
.settings-panel.open{opacity:1;pointer-events:all}
.settings-drawer{
  position:absolute;left:0;top:0;bottom:0;width:300px;
  background:var(--panel);border-right:1px solid var(--border);
  overflow-y:auto;padding:24px 18px;
  transform:translateX(-100%);transition:transform .25s ease;
  scrollbar-width:thin;
}
.settings-panel.open .settings-drawer{transform:translateX(0)}
.settings-close{
  position:absolute;top:18px;right:18px;
  background:var(--panel2);border:1px solid var(--border);
  border-radius:50%;width:30px;height:30px;color:var(--dim);
  cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;
}
.settings-close:hover{color:var(--text)}
.settings-h{font-size:15px;font-weight:800;margin-bottom:20px}
.settings-sec{margin-bottom:22px}
.settings-sec h4{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px}
.settings-key-val{
  font-size:11px;font-family:monospace;color:var(--dim);
  background:var(--panel2);border:1px solid var(--border);
  border-radius:6px;padding:5px 9px;margin-bottom:7px;word-break:break-all;
}
.settings-row-btns{display:flex;gap:5px}
.btn-sm{font-size:10px;padding:3px 10px;border-radius:5px;cursor:pointer;font-family:inherit;border:1px solid var(--border);background:var(--panel2);color:var(--dim);transition:all .15s}
.btn-sm:hover{color:var(--text);border-color:var(--dim)}
.btn-sm.danger{color:#e05c5c;border-color:#e05c5c}
.btn-sm.danger:hover{background:rgba(224,92,92,.1)}
.settings-info{font-size:11px;color:var(--dim)}

/* ===== Toast ===== */
#toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(14px);
  background:var(--text);color:var(--bg);
  border-radius:8px;padding:8px 16px;font-size:12px;font-weight:600;
  opacity:0;pointer-events:none;transition:all .22s;z-index:200;
  max-width:80vw;word-break:break-word;text-align:center;line-height:1.5;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== Mobile ===== */
/* Hidden on PC; visible only in mobile media query below */
#mobile-bottom{display:none!important}
@media (max-width:767px){
  #mobile-bottom{display:flex!important}
}

@media (max-width:767px) {
  /* App shell: flex column, full viewport, no overflow */
  .app{
    display:flex;flex-direction:column;
    grid-template-columns:unset;
    height:100vh;height:100dvh;overflow:hidden;
  }
  /* Sidebar becomes a compact sticky top bar */
  .sidebar{
    flex-shrink:0;height:auto;overflow:visible;
    border-right:none;border-bottom:1px solid var(--border);
  }
  .sidebar-head{padding:8px 12px}
  .logo{font-size:12px;margin-bottom:5px}
  .logo span{display:none}                    /* hide subtitle on mobile */
  .sidebar-controls select{font-size:11px;padding:4px 6px}
  .icon-btn{width:28px;height:28px;font-size:12px}
  #tabs{
    flex-direction:row;flex:none;
    overflow-x:auto;overflow-y:hidden;
    padding:3px 8px;border-top:1px solid var(--border);
    scrollbar-width:none;
  }
  #tabs::-webkit-scrollbar{display:none}
  .tier-label{display:none}
  .tab-actions{
    flex-shrink:0;padding:0 8px 0 0;gap:3px;
    border-right:1px solid var(--border);margin-right:4px;
  }
  .tab-sel-count{display:none}
  .tab-action-btn{font-size:9px;padding:3px 7px}
  .tab{
    flex-direction:column;gap:1px;
    padding:4px 7px;min-width:fit-content;
    text-align:center;font-size:11px;
  }
  .tab .tab-cur{display:none}
  .tab .count{margin-left:0;font-size:9px}
  .sidebar-foot{display:none}                 /* hidden — use bottom bar */

  /* Main: fills remaining height, scrolls internally */
  .main{flex:1;overflow:hidden;min-height:0;height:auto}
  .scroll-area{height:100%;padding-bottom:72px;-webkit-overflow-scrolling:touch}
  #content{padding:10px 10px 10px;gap:12px}
  .cat-bar{padding:6px 10px;gap:4px}
  .cat-filter{font-size:11px;padding:3px 9px}
  .period-bar{padding:3px 10px;font-size:10px}

  /* Compact card styles on mobile */
  .card{padding:10px 12px}
  .card-title{font-size:12px}
  .card-summary{font-size:11px}
  .country-title{font-size:13px}
  .country-notes{font-size:10px;padding:5px 9px}

  /* Mobile bottom bar — flex child (no fixed, avoids iOS Safari tap bug) */
  #mobile-bottom{
    display:flex;flex-shrink:0;
    padding:8px 14px;

    '財政':'fiscal','マーケット直撃':'mktdirect','速報':'breaking',
    '政治':'geo','経済':'indicator','マーケット':'mktdirect',
  };

  // Filter aliases (v2 cat → also match legacy cats)
  const CAT_ALIASES = {
    '地政学':       ['地政学','政治'],
    '経済指標':     ['経済指標','経済'],
    'マーケット直撃':['マーケット直撃','マーケット'],
  };

  // ===== localStorage helpers =====
  const LS_KEY  = 'anthropic_api_key';
  const LS_BPX  = 'briefing_';
  const LS_UPD  = 'briefing_last_updated';
  const LS_SEL  = 'selected_countries';

  const ls = {
    key:       () => localStorage.getItem(LS_KEY) || '',
    setKey:    k  => k ? localStorage.setItem(LS_KEY, k) : localStorage.removeItem(LS_KEY),
    mask:      k  => k ? k.slice(0,10) + '****' + k.slice(-4) : '未設定',
    get:       d  => { try { return JSON.parse(localStorage.getItem(LS_BPX+d)); } catch { return null; } },
    set:       (d, data) => {
      localStorage.setItem(LS_BPX+d, JSON.stringify(data));
      localStorage.setItem(LS_UPD, new Date().toISOString());
      // prune >7 days
      const cut = new Date(); cut.setDate(cut.getDate()-7);
      const cutStr = cut.toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});
      Object.keys(localStorage).forEach(k => {
        if (k.startsWith(LS_BPX) && k.replace(LS_BPX,'') < cutStr) localStorage.removeItem(k);
      });
    },
    cacheCount: () => Object.keys(localStorage).filter(k => k.startsWith(LS_BPX)).length,
    clearCache: () => {
      Object.keys(localStorage).forEach(k => { if (k.startsWith(LS_BPX)) localStorage.removeItem(k); });
      localStorage.removeItem(LS_UPD);
    },
  };

  function todayJST() {
    return new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Tokyo' });
  }

  // ===== Normalize legacy JSON =====
  function normalize(data) {
    if (!data || !data.countries) return data;
    const out = {};
    Object.entries(data.countries).forEach(([k, v]) => {
      const mapped = COUNTRIES[k] ? k : (LEGACY[k] || k);
      out[mapped] = v;
    });
    return { ...data, countries: out };
  }

  // ===== Selected countries persistence =====
  function loadSelectedCountries() {
    try {
      const saved = JSON.parse(localStorage.getItem(LS_SEL));
      if (Array.isArray(saved)) return new Set(saved.filter(k => COUNTRIES[k]));
    } catch {}
    return new Set(Object.keys(COUNTRIES)); // default: all selected
  }

  // ===== State =====
  const briefings = {};
  const state = {
    date: null,
    selectedCountries: loadSelectedCountries(),
    category: 'all',
    generating: false,
    // Per-country collapsed state: Tier2/3 start collapsed

      Object.entries(COUNTRIES).filter(([,v]) => v.tier >= 2).map(([k]) => k)

  // ===== Load initial data =====
  function loadInitialData() {
    const today = todayJST();
    // 1. localStorage first
    const cached = ls.get(today);
    if (cached) briefings[today] = normalize(cached);

    // 2. HTML-embedded JSON blocks (from scheduled agent)
    document.querySelectorAll('script[type="application/json"][id^="briefing-"]').forEach(el => {
      const date = el.id.replace('briefing-','');
      if (briefings[date]) return; // ls wins

        briefings[date] = data;
        if (!ls.get(date)) ls.set(date, data);

  // ===== Date selector =====

  // ===== Helpers =====
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  const CONF_LBL = { high:'確度高', medium:'確度中', unknown:'不明' };

  // ===== renderCard =====
  function renderCard(item) {
    const cat  = item.category || '';
    const conf = item.confidence || 'unknown';
    const cls  = CAT_CLS[cat] || 'unknown';

    const bg = item.background
      ? `<details class="bg-detail"><summary>背景・文脈</summary><div class="card-bg">${esc(item.background)}</div></details>`
      : '';

    const sources = (item.sources || []).filter(s => s.url && s.label)
      .map(s => `<a class="source-link" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`)
      .join('');

      .map(t => `<span class="asset-tag ${esc(t.dir)}">${esc(t.asset)}${t.dir==='up'?'↑':'↓'}</span>`)
      .join('');

    const titleCls = item.is_breaking ? 'card-title breaking' : 'card-title';

    return `
<div class="card" data-cat="${esc(cat)}">
  <div class="card-head">
    <div class="${titleCls}">${esc(item.title)}</div>
    <div class="badges">
      ${cat ? `<span class="badge badge-${cls}">${esc(cat)}</span>` : ''}
      <span class="badge badge-conf ${esc(conf)}">${CONF_LBL[conf]||conf}</span>
    </div>
  </div>
  ${item.summary ? `<div class="card-summary">${esc(item.summary)}</div>` : ''}
  ${bg}
  ${tags ? `<div class="asset-tags">${tags}</div>` : ''}
  ${sources ? `<div class="card-sources">${sources}</div>` : ''}
</div>`;
  }

  // ===== renderCountry =====
  function filterItems(items, cat) {
    if (cat === 'all') return items;
    if (cat === '速報') return items.filter(it => it.is_breaking === true);
    const aliases = CAT_ALIASES[cat] || [cat];
    return items.filter(it => aliases.includes(it.category));
  }

  function renderCountry(key, c) {
    const info = COUNTRIES[key];
    const tier = info ? info.tier : 3;
    const items = filterItems(c.items || [], state.category);
    if (!items.length && state.category !== 'all') return '';

    const label = info
      ? `${info.label} <small style="font-size:.8em;opacity:.5">${info.cur}</small>`
      : esc(c.label || key);

    const isCollapsed = state.collapsed.has(key);
    const notes = c.notes ? `<div class="country-notes">${esc(c.notes)}</div>` : '';
    const cards = items.map(renderCard).join('');

    return `
<section class="country-section${isCollapsed?' collapsed':''}" data-key="${esc(key)}" data-tier="${tier}">
  <div class="country-header" onclick="_toggleCountry('${esc(key)}')">
    <h2 class="country-title">${label}</h2>
    <span class="country-count">${items.length}件</span>
    <span class="country-chevron">▼</span>
  </div>
  <div class="country-cards">${notes}${cards}</div>
</section>`;
  }

  // ===== renderTabs =====
  function renderTabs() {

      html += `<button class="tab${sel ? ' selected' : ''}" onclick="_toggleCountrySelect('${esc(k)}')">
  <span>${v.label}<span class="tab-cur"> ${v.cur}</span></span>

</button>`;

  // ===== JSON truncation repair =====
  // When max_tokens is hit mid-stream the JSON ends abruptly (e.g. "Expected ']'").
  // This closes any unclosed brackets so JSON.parse has a chance to succeed.
  function repairJson(s) {
    s = s.trim();
    let braces = 0, brackets = 0, inStr = false, esc = false, lastSafe = 0;
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (esc)            { esc = false; continue; }
      if (c==='\\' && inStr) { esc = true; continue; }
      if (c==='"')        { inStr = !inStr; continue; }
      if (inStr)          continue;
      if (c==='{') braces++;
      else if (c==='[') brackets++;
      else if (c==='}') { braces--; if (braces<=2&&brackets===0) lastSafe=i+1; }
      else if (c===']') { brackets--; }
    }
    // If truncated inside a string, roll back to last safe closing brace
    if (inStr && lastSafe>0) s = s.slice(0, lastSafe);
    s = s.replace(/,\s*$/, ''); // remove trailing comma
    // Recount after possible truncation
    braces=0; brackets=0; inStr=false; esc=false;
    for (const c of s) {
      if (esc){esc=false;continue;} if(c==='\\'&&inStr){esc=true;continue;}
      if(c==='"'){inStr=!inStr;continue;} if(inStr)continue;
      if(c==='{')braces++; else if(c==='[')brackets++;
      else if(c==='}')braces--; else if(c===']')brackets--;
    }
    while (brackets>0){s+=']';brackets--;} while(braces>0){s+='}';braces--;}
    return s;
  }

  // ===== Anthropic API streaming =====
  async function callAPI(apiKey, prompt, onChunk) {
    abortCtrl = new AbortController();
    const res = await fetch(API_URL, {
      method: 'POST',
      signal: abortCtrl.signal,
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: MODEL, max_tokens: MAX_TOKENS, stream: true,
        tools: [{ type: 'web_search_20250305', name: 'web_search', max_uses: 15 }],
        messages: [{ role: 'user', content: prompt }],
      }),
    });
    if (!res.ok) {
      let detail = '';
      try { const b = await res.json(); detail = b?.error?.message || ''; } catch {}
      const M = {
        400: `リクエストが不正です。${detail ? detail : 'モデル名またはパラメータを確認してください。'}`,
        401: 'APIキーが無効です。設定を確認してください。',
        403: `アクセス権限がありません。${detail || ''}`,
        429: 'レート制限中です。しばらく後に再試行してください。',
        500: 'Anthropicサーバーエラーです。再試行してください。',
      };
      throw new Error(M[res.status] || `APIエラー (${res.status})${detail ? ': ' + detail : ''}`);
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let full = '', buf = '';
    // Track current content block type to skip tool_use/tool_result blocks
    let blockType = 'text';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop() || '';
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6).trim();
        if (payload === '[DONE]') break;
        try {
          const ev = JSON.parse(payload);
          // Track block type so we only accumulate text from text blocks
          if (ev.type === 'content_block_start') {
            blockType = ev.content_block?.type || 'text';
          }
          if (ev.type === 'content_block_delta' && blockType === 'text') {
            const delta = ev.delta?.text || '';
            if (delta) { full += delta; onChunk(delta); }
          }
        } catch {}
      }
    }
    return full;
  }

  // ===== Build prompt =====
  function buildPrompt(date) {
    const now = new Date();
    const jstNow = now.toLocaleString('ja-JP', {
      timeZone: 'Asia/Tokyo',
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit',
    });
    const yd = new Date(now);
    yd.setDate(yd.getDate() - 1);
    const yesterday = yd.toLocaleDateString('sv-SE', { timeZone: 'Asia/Tokyo' });

    return `あなたは日本のメガバンク市場部門FXトレーダー向けのマーケットニュースブリーフィングを生成するAIです。

今日の日付: ${date}（現在: ${jstNow} JST）
【カバー期間】 ${yesterday} 00:00 JST 〜 ${date} 現在時刻

このカバー期間内に各国・地域で発生した経済・金融・地政学的に重要なニュースをウェブ検索で収集し、ブリーフィングを作成してください。
カバー期間外の古いニュースは含めないこと。カバー期間内にニュースが見つからない国は items:[] として notes に理由を記載すること。

【ソース方針 — 重要】
- 現地メディアを最優先で検索・引用すること
  - 南アフリカ: IOL / Daily Maverick / Business Day / TimesLIVE
  - トルコ: Hurriyet Daily News / Daily Sabah / Anadolu Agency
  - ハンガリー: Daily News Hungary / Hungary Today / Telex
  - ポーランド: Notes from Poland / Polskie Radio / TVP World
  - チェコ: Czech Radio / Prague Morning / Aktuálně
  - シンガポール: The Straits Times / CNA / Business Times
  - メキシコ: El Economista / Reforma / El Financiero
  - フィリピン: Philippine Daily Inquirer / Manila Times / BusinessMirror
  - タイ: Bangkok Post / The Nation / Khaosod English
  - 韓国: Korea Herald / Yonhap News / Korea Times
  - 台湾: Taiwan News / CNA (Taiwan) / Taipei Times
  - 各国: Reuters / Bloomberg / FT も可
- sources には実際の記事URL または公式メディアサイトのURLを記載する
  （例: {"label":"Daily Maverick","url":"https://dailymaverick.co.za"}）
- URLを捏造・推測しないこと。自信がないURLはメディアのトップページURLを使う

【対象国・Tier・最低件数】

  // ===== Generate briefing =====
  async function generateBriefing() {
    const k = ls.key();
    if (!k) { showApiKeyModal(true); return; }

    setGenerating(true);
    const today = todayJST();
    let tickTimer = null;

    try {
      const prompt = buildPrompt(today);
      $genLabel.textContent = 'ブリーフィングを生成中...';

      // Progress tracking
      const EST_CHARS = 28000; // typical full JSON for 21 countries
      let charsReceived = 0;
      const startTime = Date.now();

      const fmtSec = s => s < 60 ? `${s}秒` : `${Math.floor(s/60)}分${s%60}秒`;

      tickTimer = setInterval(() => {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        $genElapsed.textContent = `${fmtSec(elapsed)}経過`;
        if (charsReceived > 200) {
          const rate = charsReceived / Math.max(elapsed, 1);
          const remaining = Math.max(0, Math.round((EST_CHARS - charsReceived) / rate));
          $genEta.textContent = remaining > 0 ? `残り約${fmtSec(remaining)}` : 'まもなく完了...';
        }
      }, 1000);

      const fullText = await callAPI(k, prompt, chunk => {
        charsReceived += chunk.length;
        $genStream.textContent += chunk;
        $genStream.scrollTop = $genStream.scrollHeight;
        // Update progress bar (cap at 95% until done)
        const pct = Math.min(95, Math.round(charsReceived / EST_CHARS * 100));
        $genBar.style.width = pct + '%';
        $genPct.textContent = pct + '%';
      });

      clearInterval(tickTimer);
      $genBar.style.width = '100%';
      $genPct.textContent = '100%';
      $genEta.textContent = '完了!';
      const totalSec = Math.floor((Date.now() - startTime) / 1000);
      $genElapsed.textContent = `${fmtSec(totalSec)}経過`;

      if (!fullText || fullText.trim().length === 0) {
        throw new Error('APIからの応答が空でした。再試行してください。');
      }

      // Parse JSON from response — extract → parse → repair if truncated
      let data;
      try {
        // Extract raw JSON string from various response formats
        function extractJsonStr(text) {
          const m1 = text.match(/```json\s*([\s\S]+?)(?:\s*```|$)/);
          if (m1) return m1[1];
          const m2 = text.match(/```\s*([\s\S]+?)(?:\s*```|$)/);
          if (m2) return m2[1];
          const start = text.indexOf('{');
          if (start !== -1) return text.slice(start); // include to end (may be truncated)
          return null;
        }

        const jsonStr = extractJsonStr(fullText);
        if (!jsonStr) {
          console.error('[Raw response]', fullText.slice(0, 500));
          throw new Error('レスポンスからJSONを抽出できませんでした。再試行してください。');
        }

        let parsed;
        try {
          parsed = JSON.parse(jsonStr);
        } catch(e1) {
          // JSON was likely truncated at max_tokens — attempt repair
          console.warn('[JSON truncated] attempting repair...', e1.message);
          const repaired = repairJson(jsonStr);
          console.info('[Repaired JSON length]', repaired.length);
          try {
            parsed = JSON.parse(repaired);
          } catch(e2) {
            console.error('[Repair failed]', e2.message, '\n[Raw 500]', fullText.slice(0,500));
            throw new Error(`JSON解析エラー（修復失敗）: ${e2.message}`);
          }
        }
        data = normalize(parsed);
      } catch(parseErr) {
        if (!parseErr.message.startsWith('JSON')) {
          console.error('[Parse error]', parseErr);
        }
        throw parseErr;
      }
      ls.set(today, data);
      briefings[today] = data;

      // Update date selector
      const opts = Array.from($dateSelect.options);
      if (!opts.some(o => o.value === today)) {
        const o = document.createElement('option');
        o.value = today; o.textContent = today + '（今日）';
        $dateSelect.insertBefore(o, $dateSelect.firstChild);
      }
      $dateSelect.value = today;
      state.date = today;
      state.selectedCountries = new Set(Object.keys(COUNTRIES));
      saveSelectedCountries();
      render();
      toast('ブリーフィングを生成しました ✓');
    } catch(err) {
      if (err.name === 'AbortError') return;
      console.error('[API Error]', err);
      if (err.message.includes('401') || err.message.includes('APIキーが無効')) {
        toast('APIキーエラー。設定を確認してください', 6000);
        showApiKeyModal(false);
      } else if (err.message === 'Load failed' || err.message === 'Failed to fetch') {
        toast('通信エラー。ネットワーク接続を確認して再試行してください。', 8000);
      } else {
        toast(`エラー: ${err.message}`, 8000);
      }
    } finally {
      clearInterval(tickTimer);
      setGenerating(false);
    }
  }

  // ===== Event listeners =====
  $genBtn.addEventListener('click', generateBriefing);
  $mobileGenBtn.addEventListener('click', generateBriefing);
  $refreshBtn.addEventListener('click', generateBriefing);
  $mobileApiStatus.addEventListener('click', () => showApiKeyModal(false));

  // ===== Init =====
  loadInitialData();
  setupDateSelector();
  render();

})();
