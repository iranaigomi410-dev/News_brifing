<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海外ニュース・デイリーブリーフィング</title>
<style>
/* ===== Design tokens ===== */
:root {
  --bg:        #0d1117;
  --sidebar:   #13161f;
  --panel:     #1c2030;
  --panel2:    #242840;
  --border:    #2d3250;
  --text:      #e2e8f6;
  --dim:       #8b97b8;
  --muted:     #505c7a;
  --accent:    #5b9bff;
  --accent2:   #3a7be0;
  --politics:  #e05c5c;
  --economy:   #f6a035;
  --fiscal:    #34d399;
  --market:    #a78bfa;
  --high:      #34d399;
  --medium:    #f6a035;
  --radius:    10px;
  --shadow:    0 2px 16px rgba(0,0,0,.45);
}
@media (prefers-color-scheme: light) {
  :root {
    --bg:      #f0f2f8;
    --sidebar: #ffffff;
    --panel:   #ffffff;
    --panel2:  #f4f6fc;
    --border:  #dde0ec;
    --text:    #1a1e2e;
    --dim:     #4a5268;
    --muted:   #8892a8;
    --shadow:  0 2px 16px rgba(0,0,0,.08);
  }
}

/* ===== Reset ===== */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  font-size:15px;line-height:1.7}

/* ===== App shell ===== */
.app{display:grid;grid-template-columns:248px 1fr;height:100vh}

/* ===== Sidebar ===== */
.sidebar{
  background:var(--sidebar);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  height:100vh;overflow:hidden;
}
.sidebar-head{
  padding:18px 16px 14px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.logo{font-size:14px;font-weight:800;letter-spacing:.04em;color:var(--text);margin-bottom:12px}
.logo span{display:block;font-size:11px;font-weight:400;color:var(--muted);letter-spacing:.01em;margin-top:2px}
.sidebar-controls{display:flex;gap:6px;align-items:center}
.sidebar-controls select{
  flex:1;background:var(--panel2);color:var(--text);
  border:1px solid var(--border);border-radius:7px;
  padding:6px 10px;font-size:13px;font-family:inherit;cursor:pointer;
}
.sidebar-controls select:hover{border-color:var(--accent)}
.icon-btn{
  flex-shrink:0;background:var(--accent);color:#fff;border:none;
  border-radius:7px;width:34px;height:34px;font-size:15px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.icon-btn:hover{background:var(--accent2)}

/* Country nav */
#tabs{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:8px;display:flex;flex-direction:column;gap:2px;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent;
}
#tabs::-webkit-scrollbar{width:4px}
#tabs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.tab{
  display:flex;align-items:center;justify-content:space-between;
  width:100%;background:transparent;border:1.5px solid transparent;
  color:var(--dim);padding:8px 10px;border-radius:8px;
  font-size:13px;font-family:inherit;cursor:pointer;
  transition:all .15s;text-align:left;white-space:nowrap;
}
.tab:hover{background:var(--panel);color:var(--text)}
.tab.active{background:rgba(91,155,255,.1);color:var(--accent);border-color:rgba(91,155,255,.25);font-weight:700}
.tab .count{
  font-size:11px;padding:1px 7px;border-radius:999px;
  background:var(--panel2);color:var(--muted);flex-shrink:0;margin-left:6px;
}
.tab.active .count{background:rgba(91,155,255,.15);color:var(--accent)}

.sidebar-foot{padding:12px;border-top:1px solid var(--border);flex-shrink:0}
.update-btn{
  width:100%;background:var(--panel2);color:var(--dim);
  border:1px solid var(--border);border-radius:8px;
  padding:9px 14px;font-size:12px;font-weight:600;
  font-family:inherit;cursor:pointer;transition:all .15s;
}
.update-btn:hover{color:var(--text);border-color:var(--dim)}

/* ===== Main ===== */
.main{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* Category bar */
.cat-bar{
  display:flex;gap:6px;padding:10px 20px;
  background:var(--bg);border-bottom:1px solid var(--border);
  flex-shrink:0;overflow-x:auto;scrollbar-width:none;
}
.cat-bar::-webkit-scrollbar{display:none}
.cat-filter{
  background:transparent;border:1.5px solid var(--border);
  color:var(--dim);padding:5px 16px;border-radius:999px;
  font-size:12px;font-weight:600;font-family:inherit;
  cursor:pointer;white-space:nowrap;transition:all .15s;
}
.cat-filter:hover{color:var(--text);border-color:var(--dim)}
.cat-filter.active{border-width:2px}
.cat-filter[data-cat="all"].active    {background:var(--accent);color:#fff;border-color:var(--accent)}
.cat-filter[data-cat="政治"].active   {background:rgba(224,92,92,.12);color:var(--politics);border-color:var(--politics)}
.cat-filter[data-cat="経済"].active   {background:rgba(246,160,53,.12);color:var(--economy);border-color:var(--economy)}
.cat-filter[data-cat="財政"].active   {background:rgba(52,211,153,.12);color:var(--fiscal);border-color:var(--fiscal)}
.cat-filter[data-cat="マーケット"].active{background:rgba(167,139,250,.12);color:var(--market);border-color:var(--market)}

/* Period info */
.period-bar{
  padding:5px 20px;font-size:11px;color:var(--muted);
  background:var(--bg);border-bottom:1px solid var(--border);
  flex-shrink:0;
}

/* Scroll area */
.scroll-area{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.scroll-area::-webkit-scrollbar{width:6px}
.scroll-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

#content{padding:22px 28px 60px;max-width:840px}

/* ===== Country section ===== */
.country-section{margin-bottom:40px}
.country-header{
  display:flex;align-items:center;gap:10px;
  margin-bottom:14px;padding-bottom:10px;
  border-bottom:2px solid var(--border);
}
.country-title{font-size:17px;font-weight:800;letter-spacing:-.02em}
.country-count{
  font-size:11px;color:var(--muted);background:var(--panel2);
  padding:2px 9px;border-radius:999px;
}
.country-notes{
  background:var(--panel2);border-left:3px solid var(--muted);
  padding:8px 12px;margin-bottom:12px;font-size:12px;
  color:var(--dim);border-radius:0 6px 6px 0;
}

/* ===== Card ===== */
.card{
  background:var(--panel);border:1px solid var(--border);
  border-left-width:3px;border-radius:var(--radius);
  padding:16px 18px;margin-bottom:10px;
  box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s;
  border-left-color:var(--border);
}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,0,0,.5)}
.card.cat-政治   {border-left-color:var(--politics)}
.card.cat-経済   {border-left-color:var(--economy)}
.card.cat-財政   {border-left-color:var(--fiscal)}
.card.cat-マーケット{border-left-color:var(--market)}
.card.confidence-unknown{opacity:.7}

.card-head{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;margin-bottom:8px}
.card-title{font-size:15px;font-weight:700;line-height:1.45;flex:1 1 auto;min-width:0}
.badges{display:flex;gap:5px;flex-wrap:wrap;flex-shrink:0;align-items:center}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.badge-政治   {background:rgba(224,92,92,.15);color:var(--politics)}
.badge-経済   {background:rgba(246,160,53,.15);color:var(--economy)}
.badge-財政   {background:rgba(52,211,153,.15);color:var(--fiscal)}
.badge-マーケット{background:rgba(167,139,250,.15);color:var(--market)}
.badge-conf{background:var(--panel2);color:var(--muted);font-size:10px;padding:2px 8px;border-radius:999px}
.badge-conf.high  {background:rgba(52,211,153,.1);color:var(--high)}
.badge-conf.medium{background:rgba(246,160,53,.1);color:var(--medium)}

.card-summary{font-size:14px;line-height:1.7;color:var(--text);margin-bottom:6px}

details.bg-detail{margin-top:8px}
details.bg-detail summary{
  font-size:11px;font-weight:600;color:var(--muted);
  cursor:pointer;list-style:none;display:flex;align-items:center;gap:5px;
  user-select:none;transition:color .15s;
}
details.bg-detail summary:hover{color:var(--dim)}
details.bg-detail summary::before{content:"▶";font-size:8px;transition:transform .15s;display:inline-block}
details.bg-detail[open] summary::before{transform:rotate(90deg)}
details.bg-detail summary::-webkit-details-marker{display:none}
.card-bg{
  font-size:13px;color:var(--dim);background:var(--panel2);
  padding:10px 12px;border-radius:7px;margin-top:6px;line-height:1.65;
}

.card-sources{margin-top:10px;display:flex;flex-wrap:wrap;gap:5px}
.card-sources a{
  font-size:11px;color:var(--muted);background:var(--panel2);
  border:1px solid var(--border);padding:3px 10px;border-radius:999px;
  text-decoration:none;transition:all .15s;
}
.card-sources a::before{content:"↗ ";font-size:10px}
.card-sources a:hover{color:var(--accent);border-color:var(--accent)}

.empty-state{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px}
.footer-note{padding:16px 28px 32px;font-size:11px;color:var(--muted);border-top:1px solid var(--border);max-width:840px}

/* ===== Modal ===== */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.65);
  display:none;align-items:center;justify-content:center;z-index:200;padding:16px;
}
.modal-backdrop.open{display:flex}
.modal{
  background:var(--panel);border:1px solid var(--border);
  border-radius:14px;max-width:620px;width:100%;
  max-height:85vh;overflow-y:auto;padding:24px;
  box-shadow:0 16px 48px rgba(0,0,0,.55);
}
.modal h2{font-size:16px;margin-bottom:6px}
.modal p{font-size:13px;color:var(--dim);margin-bottom:12px}
.modal textarea{
  width:100%;min-height:200px;background:var(--panel2);color:var(--text);
  border:1px solid var(--border);border-radius:8px;padding:12px;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  font-size:12px;line-height:1.5;resize:vertical;
}
.modal-actions{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
button{
  background:var(--panel2);color:var(--text);border:1px solid var(--border);
  border-radius:8px;padding:8px 16px;font-size:13px;font-family:inherit;
  cursor:pointer;transition:all .15s;
}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
button.primary:hover{background:var(--accent2);border-color:var(--accent2)}

/* ===== Toast ===== */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--accent);color:#fff;padding:10px 22px;
  border-radius:999px;font-size:13px;font-weight:600;
  opacity:0;transition:opacity .2s;z-index:300;pointer-events:none;
}
.toast.show{opacity:1}

/* ===== Mobile ===== */
@media(max-width:767px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:100dvh}
  .sidebar{
    height:auto;flex-direction:column;
    border-right:none;border-bottom:1px solid var(--border);
  }
  .sidebar-head{padding:12px 14px 10px}
  .logo span{display:none}
  #tabs{
    flex-direction:row;overflow-x:auto;overflow-y:hidden;
    padding:6px 10px;max-height:none;
    scrollbar-width:none;
  }
  #tabs::-webkit-scrollbar{display:none}
  .tab{flex-shrink:0;width:auto;padding:6px 12px;font-size:12px}
  .sidebar-foot{display:none}
  .main{height:auto;overflow:hidden}
  .scroll-area{height:calc(100dvh - 160px)}
  #content{padding:14px 14px 60px}
  .cat-bar{padding:8px 12px}
  .period-bar{padding:4px 14px;font-size:10px}
}
</style>
</head>
<body>
<div class="app">

  <!-- ===== Sidebar ===== -->
  <aside class="sidebar">
    <div class="sidebar-head">
      <div class="logo">🌐 海外ニュース<span>デイリーブリーフィング・17か国</span></div>
      <div class="sidebar-controls">
        <select id="date-select" aria-label="日付選択"></select>
        <button id="update-now-btn" class="icon-btn" title="今すぐ更新">↻</button>
      </div>
    </div>
    <nav id="tabs" role="tablist" aria-label="国・地域を選択"></nav>
    <div class="sidebar-foot">
      <button class="update-btn" id="update-now-btn-2">↻ 今すぐ更新</button>
    </div>
  </aside>

  <!-- ===== Main ===== -->
  <div class="main">
    <div class="cat-bar" id="filter-bar" role="group" aria-label="カテゴリ絞り込み">
      <button class="cat-filter active" data-cat="all">すべて</button>
      <button class="cat-filter" data-cat="政治">🏛 政治</button>
      <button class="cat-filter" data-cat="経済">📈 経済</button>
      <button class="cat-filter" data-cat="財政">🏦 財政</button>
      <button class="cat-filter" data-cat="マーケット">💹 マーケット</button>
    </div>
    <div class="period-bar" id="period-info"></div>
    <div class="scroll-area">
      <div id="content"></div>
      <div class="footer-note" id="footer-note"></div>
    </div>
  </div>
</div>

<!-- ===== Modal ===== -->
<div class="modal-backdrop" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <h2 id="modal-title">↻ 今すぐ更新</h2>
    <p>このアプリは LLM を直接呼べないため、下のプロンプトを Claude に貼り付けて実行してください。</p>
    <p><strong>対象:</strong> <span id="modal-target"></span></p>
    <textarea id="prompt-text" readonly></textarea>
    <div class="modal-actions">
      <button id="close-modal">閉じる</button>
      <button id="copy-btn" class="primary">📋 プロンプトをコピー</button>
    </div>
  </div>
</div>
<div class="toast" id="toast">コピーしました</div>

<script>
(function () {
  'use strict';

  // ===== Load briefings =====
  const briefings = {};
  document.querySelectorAll('script[type="application/json"][id^="briefing-"]').forEach(el => {
    const date = el.id.replace('briefing-', '');
    try { briefings[date] = JSON.parse(el.textContent); } catch (e) { console.error(date, e); }
  });
  const availableDates = Object.keys(briefings).sort().reverse();

  const state = { date: availableDates[0] || null, country: '__all__', category: 'all' };

  const $dateSelect  = document.getElementById('date-select');
  const $tabs        = document.getElementById('tabs');
  const $content     = document.getElementById('content');
  const $periodInfo  = document.getElementById('period-info');
  const $footer      = document.getElementById('footer-note');
  const $modal       = document.getElementById('modal');
  const $modalTarget = document.getElementById('modal-target');
  const $promptText  = document.getElementById('prompt-text');
  const $copyBtn     = document.getElementById('copy-btn');
  const $closeBtn    = document.getElementById('close-modal');
  const $toast       = document.getElementById('toast');

  // ===== Date selector =====
  function setupDateSelector() {
    if (!availableDates.length) {
      const o = document.createElement('option');
      o.textContent = 'データなし';
      $dateSelect.appendChild(o);
      $dateSelect.disabled = true;
      return;
    }
    availableDates.forEach(d => {
      const o = document.createElement('option');
      o.value = d; o.textContent = d + ' JST';
      $dateSelect.appendChild(o);
    });
    $dateSelect.value = state.date;
    $dateSelect.addEventListener('change', e => {
      state.date = e.target.value;
      state.country = '__all__';
      render();
    });
  }

  // ===== Category filter =====
  document.querySelectorAll('.cat-filter').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.cat-filter').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.category = btn.dataset.cat;
      renderContent();
    });
  });

  // ===== Tabs =====
  function renderTabs() {
    $tabs.innerHTML = '';
    const data = briefings[state.date];
    if (!data) return;

    const totalCount = Object.values(data.countries).reduce((a, c) => a + (c.items?.length || 0), 0);

    const allBtn = document.createElement('button');
    allBtn.className = 'tab' + (state.country === '__all__' ? ' active' : '');
    allBtn.innerHTML = `全件 <span class="count">${totalCount}</span>`;
    allBtn.addEventListener('click', () => { state.country = '__all__'; render(); });
    $tabs.appendChild(allBtn);

    Object.keys(data.countries).forEach(key => {
      const c = data.countries[key];
      const btn = document.createElement('button');
      btn.className = 'tab' + (state.country === key ? ' active' : '');
      btn.innerHTML = `${escapeHTML(c.label || key)} <span class="count">${c.items?.length || 0}</span>`;
      btn.addEventListener('click', () => { state.country = key; render(); });
      $tabs.appendChild(btn);
    });

    const active = $tabs.querySelector('.tab.active');
    if (active) active.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  }

  // ===== Render helpers =====
  function escapeHTML(s) {
    return String(s ?? '').replace(/[&<>"']/g, ch =>
      ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[ch]));
  }

  const CONF_LABEL = { high: '確度 高', medium: '確度 中', unknown: '不明' };

  function renderCard(item) {
    const cat  = item.category || '';
    const conf = item.confidence || 'unknown';
    const sources = (item.sources || [])
      .filter(s => s.url)
      .map(s => `<a href="${escapeHTML(s.url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(s.label || s.url)}</a>`)
      .join('');
    const bg = item.background
      ? `<details class="bg-detail"><summary>背景・文脈</summary><div class="card-bg">${escapeHTML(item.background)}</div></details>`
      : '';
    return `
      <div class="card cat-${escapeHTML(cat)} confidence-${escapeHTML(conf)}">
        <div class="card-head">
          <div class="card-title">${escapeHTML(item.title)}</div>
          <div class="badges">
            ${cat ? `<span class="badge badge-${escapeHTML(cat)}">${escapeHTML(cat)}</span>` : ''}
            <span class="badge badge-conf ${escapeHTML(conf)}">${escapeHTML(CONF_LABEL[conf] || conf)}</span>
          </div>
        </div>
        ${item.summary ? `<div class="card-summary">${escapeHTML(item.summary)}</div>` : ''}
        ${bg}
        ${sources ? `<div class="card-sources">${sources}</div>` : ''}
      </div>`;
  }

  function renderCountry(key, c) {
    const items = (c.items || []).filter(it => state.category === 'all' || it.category === state.category);
    if (!items.length && state.category !== 'all') return '';
    const notes = c.notes ? `<div class="country-notes">📝 ${escapeHTML(c.notes)}</div>` : '';
    const cards = items.length
      ? items.map(renderCard).join('')
      : `<div class="card"><div class="card-summary" style="color:var(--muted)">該当する記事はありません。</div></div>`;
    return `
      <section class="country-section">
        <div class="country-header">
          <h2 class="country-title">${escapeHTML(c.label || key)}</h2>
          <span class="country-count">${items.length}件</span>
        </div>
        ${notes}${cards}
      </section>`;
  }

  function renderContent() {
    const data = briefings[state.date];
    if (!data) {
      $content.innerHTML = '<div class="empty-state">この日付のデータはありません。</div>';
      return;
    }
    $periodInfo.textContent =
      `カバー期間: ${data.period?.from || ''} 〜 ${data.period?.to || ''}　生成: ${data.generated_at || ''}`;
    let html = '';
    if (state.country === '__all__') {
      Object.keys(data.countries).forEach(k => { html += renderCountry(k, data.countries[k]); });
    } else {
      const c = data.countries[state.country];
      if (c) html = renderCountry(state.country, c);
    }
    $content.innerHTML = html || '<div class="empty-state">このカテゴリに該当する記事はありません。</div>';
    $footer.textContent = data.methodology_notes || '';
  }

  function render() { renderTabs(); renderContent(); }

  // ===== Update modal =====
  function openModal() {
    const targetCountry = state.country === '__all__'
      ? '全17か国・地域'
      : (briefings[state.date]?.countries?.[state.country]?.label || state.country);
    const targetDate = state.date || '本日(JST)';
    $modalTarget.textContent = `${targetCountry} / ${targetDate}`;
    $promptText.value = buildPrompt(targetCountry, targetDate);
    $modal.classList.add('open');
  }

  function buildPrompt(targetCountry, targetDate) {
    const onlyOne = state.country !== '__all__';
    return `海外ニュース・デイリーブリーフィングを「今すぐ」更新してください。

対象日付: ${targetDate} (JST)
対象国・地域: ${targetCountry}

【収集カテゴリ】
- 政治: 主要政治動向（政権・選挙・外交・政策）
- 経済: 経済指標・産業動向・企業ニュース
- 財政: 財政政策・予算・中央銀行・金融政策
- マーケット: 為替（対USD・対JPY両建て）をメインに解説。株式指数・国債利回りは「円相場への影響」という観点で補足。各国1件目は必ずその国通貨の対USD・対JPYレートと前日比を含めること。

【手順】
1. ${onlyOne ? targetCountry + 'のみ' : '17か国すべて'}について、現地メディア中心に最新ニュースを WebSearch で収集（各国2〜3クエリ）。
2. マーケットデータを収集: USD/JPY, EUR/JPY, GBP/JPY, AUD/JPY, NZD/JPY, CAD/JPY, CHF/JPY, CNH/JPY, KRW/JPY ほか; 主要株式指数(S&P500, DAX, FTSE100, 上海総合, KOSPI など); 主要国債利回り(米10年, 独10年, 英10年)。
3. 結果を以下の JSON スキーマでまとめる:
   各アイテム: { "title", "category"("政治"|"経済"|"財政"|"マーケット"), "summary", "background", "sources":[{"label","url"}], "confidence"("high"|"medium"|"unknown") }
4. newsbriefingapp.html の <!-- ========== DATA BLOCKS END ========== --> の直前に、
   <script type="application/json" id="briefing-${targetDate}">…JSON…<\/script>
   を追記（同日付のブロックがあれば置き換え）。
5. 完了後に newsbriefingapp.html を提示してください。`;
  }

  document.getElementById('update-now-btn').addEventListener('click', openModal);
  document.getElementById('update-now-btn-2').addEventListener('click', openModal);
  $closeBtn.addEventListener('click', () => $modal.classList.remove('open'));
  $modal.addEventListener('click', e => { if (e.target === $modal) $modal.classList.remove('open'); });

  $copyBtn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText($promptText.value); }
    catch { $promptText.select(); document.execCommand('copy'); }
    $toast.classList.add('show');
    setTimeout(() => $toast.classList.remove('show'), 1800);
  });

  // ===== Init =====
  setupDateSelector();
  render();
})();
</script>
</body>
</html>
